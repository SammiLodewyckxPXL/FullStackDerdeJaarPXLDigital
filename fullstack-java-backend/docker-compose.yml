services:

  employee-db:
    image: mysql:8.4
    container_name: employee-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: employeeservice_db
    ports:
      - "3306:3306"
    volumes:
      - employee-db-data:/var/lib/mysql

  department-db:
    image: mysql:8.4
    container_name: department-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: departmentservice_db
    ports:
      - "3307:3306"
    volumes:
      - department-db-data:/var/lib/mysql

  organization-db:
    image: mysql:8.4
    container_name: organization-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: organizationservice_db
    ports:
      - "3308:3306"
    volumes:
      - organization-db-data:/var/lib/mysql

volumes:
  employee-db-data:
  department-db-data:
  organization-db-data: